server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback so client-side routes survive a refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets can be cached aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}